<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>新人ハッカソン チームメンバー紹介</title>
</head>

<body class="bg-yellow-50">
    <header class="flex justify-center items-center p-6">
        <h1 class="text-3xl text-black font-bold md:text-4xl text-black font-bold">新人ハッカソン チームメンバー</h1>
    </header>

    <!-- スマホでは縦、PC（md以上）では横 -->
    <main class="max-w-4xl mx-auto flex flex-col gap-4 rounded-lg md:flex-row justify-between bg-yellow-200 p-6 px-20">
        <div class="flex flex-col items-center rounded-lg bg-white shadow p-10 gap-2">
            <span class="text-6xl">👨‍💻</span>
            <h2 class="text-xl font-semibold">藤尾 晃大</h2>
            <p class="text-gray-600">役割: プログラマー</p>
        </div>
        <div class="flex flex-col items-center rounded-lg bg-white shadow p-10 gap-2">
            <span class="text-6xl">👨‍🎨</span>
            <h2 class="text-xl font-semibold ">松田 宗橙</h2>
            <p class="text-gray-600">役割: デザイナー</p>
        </div>
        <div class="flex flex-col items-center rounded-lg bg-white shadow p-10 gap-2">
            <span class="text-6xl">🕵️‍♂️</span>
            <h2 class="text-xl font-semibold">山根 拓己</h2>
            <p class="text-gray-600">役割: デバッカー</p>
        </div>
    </main>
</body>
</html>
