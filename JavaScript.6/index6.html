<!DOCTYPE html>
<html class="scroll-smooth" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen p-6">
    <div class="rounded-2xl shadow-2xl bg-rose-200 px-8 py-10 flex flex-col gap-12 max-w-xs md:max-w-3xl w-full">
        <h1 class="text-4xl md:text-5xl font-bold text-center mb-4">BMI計算ツール</h1>
        <div class="flex justify-center gap-4">
            <div class="w-1/3 flex flex-col gap-4 md:w-1/2">
                <label for="height" class="block text-md md:text-xl font-medium text-gray-700">身長 (cm)</label>
                <input type="number" id="height" class="w-full h-12 rounded-lg border-gray-300 p-2" placeholder="例: 170">
            </div>
            <div class="w-1/3 flex flex-col gap-4 md:w-1/2">
                <label for="weight" class="block text-md md:text-xl font-medium text-gray-700">体重 (kg)</label>
                <input type="number" id="weight" class="w-full h-12 rounded-lg border-gray-300 p-2" placeholder="例: 65">
            </div>
        </div>
        <button id="calculate" class="bg-blue-500 hover:bg-blue-600 text-2xl text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">計算する</button>
        <div id="result" class="text-center text-4xl font-bold text-gray-700">
            <p>BMI: <span id="bmiValue">—</span></p>
            <p>判定: <span id="bmiCategory">—</span></p>
        </div>
    </div>

    <script>
        function calculateBMI(){
            const height=Number(document.getElementById('height').value);
            const weight=Number(document.getElementById('weight').value);

            if(isNaN(height)||isNaN(weight)||height<=0||weight<=0){
                document.getElementById('bmiValue').textContent='0以上の正確な数値を入力してください';
                document.getElementById('bmiCategory').textContent='0以上の正確な数値を入力してください';
                return;
            }

            const heightInMeters=height/100;
            const bmi=weight/(heightInMeters**2);
            document.getElementById('bmiValue').textContent=bmi.toFixed(2);

            let category='';
            if(bmi<18.5){
                category='痩せ型';
            }else if(bmi<25){
                category='普通';
            }else if(bmi<30){
                category='肥満（1度）';
            }else{
                category='肥満（2度以上）';
            }
            document.getElementById('bmiCategory').textContent=category;
        }
        document.getElementById('calculate').addEventListener('click',calculateBMI);
    </script>
</body>
