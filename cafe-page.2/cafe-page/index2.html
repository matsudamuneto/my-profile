<!DOCTYPE html>
<html class="scroll-smooth" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>架空のカフェページ</title>
</head>

<body class="bg-green-50">
    
    <header class="fixed top-0 left-0 right-0 flex flex-row justify-between items-center p-4 border-b border-gray-300 bg-green-700/90">

        <div class="flex gap-6 pr-6">
            <a href="#menu" class="text-lg font-serif hover:text-blue-700 hover:underline hover:scale-105 transition duration-200">メニュー</a>

    <main>

                </div>

                </div>
                <div class="bg-white rounded-3xl shadow overflow-hidden">
                    <img src="./img/チョコチップクッキー.png" alt="チョコチップクッキー">

                    <p class="text-start ml-2 pb-2 text-xl font-serif hover:text-blue-700 hover:underline transition duration-200">¥400</p>

                <div class="bg-white rounded-3xl shadow overflow-hidden">

                    <p class="text-start ml-2 pb-2 text-xl font-serif hover:text-blue-700 hover:underline transition duration-200">¥600</p>
                </div>
                <div class="bg-white rounded-3xl shadow overflow-hidden">
                    <img src="./img/クロワッサン.png" alt="クロワッサン">

                    <p class="text-start ml-2 pb-2 text-xl font-serif hover:text-blue-700 hover:underline transition duration-200">¥500</p>
                </div>
            </div>
        </div>
        <div>
            <h1 class="text-center text-3xl font-bold p-10 mt-10 border-t-8 border-gray-200">ビバレッジ</h1>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mx-2">
                <div class="bg-white rounded-3xl shadow overflow-hidden">
                    <img src="./img/コーヒー.jpg" alt="コーヒー" class="object-cover">
                    <p class="text-start pt-2 px-2 text-2xl font-serif">コーヒー</p>
                    <p class="text-start ml-2 pb-2 text-xl font-serif hover:text-blue-700 hover:underline transition duration-200">¥400</p>
                </div>
                <div class="bg-white rounded-3xl shadow overflow-hidden">
                    <img src="./img/カフェオレ.png" alt="カフェオレ" class="object-cover">
                    <p class="text-start pt-2 px-2 text-2xl font-serif">カフェオレ</p>
                    <p class="text-start ml-2 pb-2 text-xl font-serif hover:text-blue-700 hover:underline transition duration-200">¥420</p>
                </div>
                <div class="bg-white rounded-3xl shadow overflow-hidden">
                    <img src="./img/紅茶.png" alt="紅茶" class="object-cover">

                    <p class="text-start ml-2 pb-2 text-xl font-serif hover:text-blue-700 hover:underline transition duration-200">¥380</p>
                </div>
                <div class="bg-white rounded-3xl shadow overflow-hidden">
                    <img src="./img/抹茶ラテ.png" alt="抹茶ラテ" class="object-cover">
                    <p class="text-start pt-2 px-2 text-2xl font-serif">抹茶ラテ</p>
                    <p class="text-start ml-2 pb-2 text-xl font-serif hover:text-blue-700 hover:underline transition duration-200">¥430</p>

    <footer class="mt-8 border-t border-gray-300">
        <p class="text-center text-sm text-gray-500 p-4">© 2026 harborsカフェ. All rights reserved.</p>
    </footer>

</html>
