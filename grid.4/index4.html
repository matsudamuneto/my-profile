<!DOCTYPE html>
<html class="scroll-smooth" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>架空のオンラインショップの商品一覧ページ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <header class="fixed top-0 left-0 w-full flex items-center justify-between bg-white shadow p-4">
        <h1 class="text-xl md:text-2xl font-semibold">HarborSオンラインショップ</h1>
        <nav class="flex mr-4 gap-4 md:mr-6 md:gap-6">
            <a href="#goods" class="text-blue-500 hover:underline hover:transition hover:scale-105">商品一覧</a>
            <a href="#cart" class="text-blue-500 hover:underline hover:transition hover:scale-105">カート</a>
        </nav>
    </header>

    <main>
        <h2 id="goods" class="text-3xl font-bold mt-20 mb-10 text-center" >商品一覧</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 px-4">
            <div class="flex flex-col items-center gap-4 odd:bg-white even:bg-blue-50 rounded-xl shadow hover:shadow-2xl">
                <p class="text-7xl pt-8">🎧</p>
                <p class="text-3xl font-semibold">ヘッドホン</p>
                <p class="text-2xl font-semibold pb-4">¥20,000</p>
            </div>
            <div class="flex flex-col items-center gap-4 odd:bg-white even:bg-blue-50 rounded-xl shadow hover:shadow-2xl">
                <p class="text-7xl pt-8">📺</p>
                <p class="text-3xl font-semibold">テレビ</p>
                <p class="text-2xl font-semibold pb-4">¥80,000</p>
            </div>
            <div class="flex flex-col items-center gap-4 odd:bg-white even:bg-blue-50 rounded-xl shadow hover:shadow-2xl">
                <p class="text-7xl pt-8">📱</p>
                <p class="text-3xl font-semibold">スマートフォン</p>
                <p class="text-2xl font-semibold pb-4">¥100,000</p>
            </div>
            <div class="flex flex-col items-center gap-4 odd:bg-white even:bg-blue-50 rounded-xl shadow hover:shadow-2xl">
                <p class="text-7xl pt-8">💻</p>
                <p class="text-3xl font-semibold">ノートパソコン</p>
                <p class="text-2xl font-semibold pb-4">¥120,000</p>
            </div>
            <div class="flex flex-col items-center gap-4 odd:bg-white even:bg-blue-50 rounded-xl shadow hover:shadow-2xl">
                <p class="text-7xl pt-8">⌚</p>
                <p class="text-2xl font-semibold">スマートウォッチ</p>
                <p class="text-2xl font-semibold pb-4">¥30,000</p>
            </div>
            <div class="flex flex-col items-center gap-4 odd:bg-white even:bg-blue-50 rounded-xl shadow hover:shadow-2xl">
                <p class="text-7xl pt-8">🎮</p>
                <p class="text-3xl font-semibold">ゲーム機</p>
                <p class="text-2xl font-semibold pb-4">¥50,000</p>
            </div>
            <div class="flex flex-col items-center gap-4 odd:bg-white even:bg-blue-50 rounded-xl shadow hover:shadow-2xl">
                <p class="text-7xl pt-8">📷</p>
                <p class="text-3xl font-semibold">カメラ</p>
                <p class="text-2xl font-semibold pb-4">¥70,000</p>
            </div>
            <div class="flex flex-col items-center gap-4 odd:bg-white even:bg-blue-50 rounded-xl shadow hover:shadow-2xl">
                <p class="text-7xl pt-8">🔊</p>
                <p class="text-3xl font-semibold">スピーカー</p>
                <p class="text-2xl font-semibold pb-4">¥40,000</p>
            </div>
        </div>
    </main>
    
    <footer class="text-center p-6 mt-10 bg-white shadow">
        <p class="text-gray-600">© 2026 HarborSオンラインショップ. All rights reserved.</p>
    </footer>

</body>
</html>
